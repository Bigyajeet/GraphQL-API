name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vault
          POSTGRES_PASSWORD: vault
          POSTGRES_DB: vault
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup test database
        run: |
          PGPASSWORD=vault psql -h localhost -U vault -d vault -c "CREATE DATABASE vault_test;"

      - name: Install dependencies
        run: bun install

      - name: Generate Prisma Client & Migrate DB
        run: |
          DATABASE_URL="postgresql://vault:vault@localhost:5432/vault?schema=public" bun run prisma db push
          TEST_DATABASE_URL="postgresql://vault:vault@localhost:5432/vault_test?schema=public" bun run prisma db push --accept-data-loss

      - name: Run Sanity Suite (Lint, Typecheck, Unit, Integration)
        env:
          DATABASE_URL: "postgresql://vault:vault@localhost:5432/vault?schema=public"
          TEST_DATABASE_URL: "postgresql://vault:vault@localhost:5432/vault_test?schema=public"
        run: bun run sanity
